[extend]
useDefault = true

# This repository is PUBLIC. A key committed here is a leaked key, whatever the
# network it was meant for (testnet deploy keys were reused as backend signers,
# and contract addresses derived from them were later trusted by prod).
# Allow-list entries stay narrow: exact public values or shapes that cannot be
# credentials. Real secrets never go here - rotate them.

[[rules]]
id = "evm-private-key"
description = "EVM private key (32-byte hex) assigned to a key/signer/deployer/owner name"
regex = '''(?i)(?:private|priv|secret|signer|deployer|owner|setup|admin|keeper)[_\-\s]*key[a-z0-9_]*['"`]?\s*[:=]\s*['"`]?(0x[0-9a-f]{64})\b'''
secretGroup = 1
keywords = ["key"]

[[allowlists]]
description = "EVM addresses (20-byte hex) are public on-chain identifiers, not keys"
regexTarget = "secret"
regexes = ['^0x[0-9a-fA-F]{40}$']

[[allowlists]]
description = "Hardhat/Anvil default account #0 key: published in the Hardhat docs, local fork only"
regexTarget = "secret"
regexes = ['''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''']

[[allowlists]]
description = "Deployment manifest names, not secrets"
regexTarget = "secret"
regexes = ['''^[A-Za-z][A-Za-z0-9]*(Erc4626|Vault|Adapter)[A-Za-z0-9]*$''']
