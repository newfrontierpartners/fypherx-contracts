name: secret-scan

# This repository is public: a committed key is a leaked key. gitleaks scans the
# commits a PR adds and the current tree (not full history - the history still
# holds keys that were removed in 2026-10 and are being retired separately).
# Runs on GitHub-hosted runners on purpose: fork PRs must never reach the
# organisation's self-hosted runners.
on:
  pull_request:
  push:
    branches: [main, develop, giwa]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, sha256-verified)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "/tmp/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  /tmp/$f" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf "/tmp/$f" -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Scan commits added by this PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --log-opts="origin/${{ github.base_ref }}..HEAD"

      - name: Scan current tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
